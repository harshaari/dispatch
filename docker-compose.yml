services:
  broker:
    image: apache/kafka:4.3.0
    hostname: broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://broker:19092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dispatch
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: dispatch
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatch -d dispatch"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - dispatch-postgres-data:/var/lib/postgresql/data

  payment-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: dispatch
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatch -d payments"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - dispatch-payment-postgres-data:/var/lib/postgresql/data

  payment-service:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infrastructure/docker/payment-service.Dockerfile
    environment:
      DB_URL: jdbc:postgresql://payment-postgres:5432/payments
      DB_USERNAME: dispatch
      DB_PASSWORD: dispatch
      KAFKA_BOOTSTRAP_SERVERS: broker:19092
    ports:
      - "8081:8080"
    depends_on:
      payment-postgres:
        condition: service_healthy
      broker:
        condition: service_started

  order-service:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infrastructure/docker/order-service.Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/dispatch
      DB_USERNAME: dispatch
      DB_PASSWORD: dispatch
      KAFKA_BOOTSTRAP_SERVERS: broker:19092
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_started

volumes:
  dispatch-postgres-data:
  dispatch-payment-postgres-data:
