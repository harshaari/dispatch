spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/payments}
    username: ${DB_USERNAME:dispatch}
    password: ${DB_PASSWORD:dispatch}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      ack-mode: record

app:
  payment:
    order-topic: ${ORDER_EVENTS_TOPIC:dispatch.order.events.v1}
    result-topic: ${PAYMENT_EVENTS_TOPIC:dispatch.payment.events.v1}
    consumer-group: ${PAYMENT_CONSUMER_GROUP:payment-service-v1}
    outbox:
      enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
      fixed-delay: ${OUTBOX_PUBLISHER_FIXED_DELAY:250ms}
      batch-size: ${OUTBOX_PUBLISHER_BATCH_SIZE:50}
      lease-duration: ${OUTBOX_PUBLISHER_LEASE_DURATION:30s}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  structured:
    format:
      console: logstash
