spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dispatch}
    username: ${DB_USERNAME:dispatch}
    password: ${DB_PASSWORD:dispatch}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

app:
  outbox:
    topic: ${OUTBOX_TOPIC:dispatch.order.events.v1}
    publisher:
      enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
      fixed-delay: ${OUTBOX_PUBLISHER_FIXED_DELAY:250ms}
      batch-size: ${OUTBOX_PUBLISHER_BATCH_SIZE:50}
      lease-duration: ${OUTBOX_PUBLISHER_LEASE_DURATION:30s}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: logstash
